services:
  night-walker:
    build: .
    container_name: ginger-night-walker
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      EVIDENCE_DIR: /app/evidence
    volumes:
      - nightwalker_evidence:/app/evidence
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

volumes:
  nightwalker_evidence:

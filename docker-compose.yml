services:
  night-walker:
    build: .
    container_name: ginger-night-walker
    init: true
    restart: unless-stopped
    # Match the host developer UID so ./data/evidence writes succeed.
    user: "1000:1000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      EVIDENCE_DIR: /app/evidence
      BROWSER_BACKEND: ${BROWSER_BACKEND:-steel}
      STEEL_CDP_HOST: ${STEEL_CDP_HOST:-auto}
      STEEL_VIEWER_HOST: ${STEEL_VIEWER_HOST:-localhost}
      STEEL_MCP_ENABLED: ${STEEL_MCP_ENABLED:-false}
      STEEL_MCP_MISSION_ENABLED: ${STEEL_MCP_MISSION_ENABLED:-true}
      STEEL_MCP_PROFILE: ${STEEL_MCP_PROFILE:-browse}
      STEEL_MCP_BASE_URL: ${STEEL_MCP_BASE_URL:-http://steel-browser:3000/v1}
      HOME: /home/appuser
    volumes:
      - ./data/evidence:/app/evidence
    depends_on:
      steel-browser:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0

  steel-browser:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: ginger-steel-browser
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9223:9223"
    volumes:
      - ./data/.cache:/app/.cache
    init: true
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true

